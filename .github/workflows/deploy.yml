name: Deploy

# Updates the install that is already running on the VPS. The checkout, the systemd unit and the
# sealed .env were provisioned once by hand (DEPLOYMENT.md) - this workflow never creates anything
# on the server, it only asks it to move to a newer commit.
#
# All the real work happens in scripts/deploy.sh, on the server: it checks out the commit, installs,
# builds, asks Prisma whether any migration is pending (backing the database up first if so),
# restarts the unit and waits for it to answer its health check.
#
# Required secrets, held by the `finarthax` environment (see `environment:` on the deploy job):
#   VPS_HOST             host or IP
#   VPS_USER             the service user that owns the checkout
#   VPS_SSH_KEY          private key whose public half is in that user's authorized_keys
#   VPS_SSH_KNOWN_HOSTS  output of `ssh-keyscan -H <host>`
# Optional:
#   VPS_PORT (22)  VPS_APP_DIR (/opt/finarthax/app)  VPS_SERVICE_NAME (finarthax)
#   APP_PUBLIC_URL - smoke-tested from the runner after the deploy
#
# Where each piece lives, because it is split across two machines:
#   this file          runs on a GitHub runner; it only opens an SSH session and reports the result
#   scripts/deploy.sh  runs on the VPS, in $APP_DIR, and does every actual step of the release
#   the checkout       /opt/finarthax/app - left on a detached HEAD by deploy.sh, so `git pull`
#                      there does nothing useful. `git rev-parse HEAD` is what tells you the version.
#
# To deploy without waiting for CI, run the same thing by hand on the server:
#   sudo -u finarthax -H bash -c '
#     cd /opt/finarthax/app
#     git fetch --prune --tags origin
#     git checkout origin/main -- scripts/deploy.sh
#     APP_DIR=/opt/finarthax/app SERVICE_NAME=finarthax bash scripts/deploy.sh origin/main'
#
# To roll back: run this workflow manually with `ref` set to the last good commit SHA - deploying an
# older commit is all a rollback is. The same works by hand with the block above.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, branch or tag to deploy"
        required: false
        default: "main"

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to VPS
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The secrets below are Environment secrets, not repository ones. Without this line the job
    # cannot see them and every `secrets.VPS_*` silently resolves to an empty string.
    environment: finarthax

    env:
      TARGET: ${{ github.event.inputs.ref || github.sha }}
      APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      APP_DIR: ${{ secrets.VPS_APP_DIR || '/opt/finarthax/app' }}
      SERVICE_NAME: ${{ secrets.VPS_SERVICE_NAME || 'finarthax' }}

    steps:
      - name: Check the required secrets are present
        # Without this, a missing VPS_HOST/VPS_USER reaches ssh as an empty destination and the only
        # clue in the log is ssh's usage screen and exit 255.
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -uo pipefail
          missing=()
          [ -n "$VPS_HOST" ] || missing+=(VPS_HOST)
          [ -n "$VPS_USER" ] || missing+=(VPS_USER)
          [ -n "$SSH_KEY" ] || missing+=(VPS_SSH_KEY)
          [ -n "$KNOWN_HOSTS" ] || missing+=(VPS_SSH_KNOWN_HOSTS)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secret(s): ${missing[*]}. They should live in the 'finarthax' environment (Settings → Environments), which this job declares via 'environment:'. Check the names match exactly, and that the job's 'environment:' still names the environment they are stored in."
            exit 1
          fi
          echo "All required secrets are set."

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned from a secret rather than ssh-keyscan'd here: a key scanned at run time would be
          # trusted sight unseen.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          set -euo pipefail
          # The remote script is fed over stdin with a quoted heredoc, so nothing in it is expanded
          # here. Everything it needs arrives as a real environment variable on the far side, which
          # keeps the quoting honest no matter what a secret contains.
          #
          # scripts/deploy.sh is taken from the commit being deployed, not from whatever the server
          # currently has checked out - otherwise a fix to the deploy script could never ship.
          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" -o BatchMode=yes -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "APP_DIR='$APP_DIR' SERVICE_NAME='$SERVICE_NAME' TARGET='$TARGET' bash -s" <<'REMOTE'
          set -e
          cd "$APP_DIR"
          git fetch --prune --tags origin
          git checkout "$TARGET" -- scripts/deploy.sh
          bash scripts/deploy.sh "$TARGET"
          REMOTE

      - name: Smoke-test the public URL
        # /api/health is loopback-only on the server, so this checks what a user actually reaches:
        # Nginx, TLS and the app behind them.
        if: ${{ success() && env.APP_PUBLIC_URL != '' }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 10 "$APP_PUBLIC_URL/api/health" >/dev/null; then
              echo "✅ $APP_PUBLIC_URL is serving"
              exit 0
            fi
            echo "attempt $attempt failed, retrying…"
            sleep 5
          done
          echo "::error::$APP_PUBLIC_URL did not answer. The server only rolled itself back if its own health check failed - check Nginx and the unit."
          exit 1
