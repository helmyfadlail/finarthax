name: CI

# Everything a deploy depends on. deploy.yml calls this workflow (workflow_call) so nothing reaches
# the server without going through these checks first.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  quality:
    name: Lint, types, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        # Imports src/lib/prisma.ts, which reads DATABASE_URL at module load but never connects
        # during a build, so a syntactically valid URL is enough.
        env:
          DATABASE_URL: postgresql://finarthax:finarthax@127.0.0.1:5432/finarthax
          NEXTAUTH_SECRET: build-time-placeholder
          NEXTAUTH_URL: http://localhost:3000
          NODE_ENV: production
        run: npm run build

  migrations:
    name: Migration safety
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finarthax
          POSTGRES_PASSWORD: finarthax
          POSTGRES_DB: finarthax
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finarthax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://finarthax:finarthax@127.0.0.1:5432/finarthax
      # Prisma migrate diff replays the migrations into this scratch DB to prove they add up to
      # schema.prisma.
      SHADOW_DATABASE_URL: postgresql://finarthax:finarthax@127.0.0.1:5432/finarthax_shadow

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to diff this branch against its base

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Create the shadow database
        run: PGPASSWORD=finarthax psql -h 127.0.0.1 -U finarthax -d finarthax -c 'CREATE DATABASE finarthax_shadow;'

      - name: Validate the migration history
        # Refuses a modified/deleted migration, a schema change with no migration, a migration
        # .gitignore would swallow, and destructive SQL that hasn't been explicitly allowed.
        env:
          MIGRATION_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || 'HEAD~1' }}
          ALLOW_DESTRUCTIVE_MIGRATIONS: ${{ contains(github.event.pull_request.labels.*.name, 'allow-destructive-migration') }}
        run: npm run db:validate

      - name: Apply the migrations from scratch
        run: npx prisma migrate deploy

      - name: Seed
        env:
          NODE_ENV: production
        run: npx prisma db seed

      - name: Re-run the seed
        # Proves the seed is idempotent - it runs again on every deploy too.
        env:
          NODE_ENV: production
        run: npx prisma db seed

      - name: Confirm the database matches the schema
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
