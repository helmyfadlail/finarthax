name: CI

# Everything a deploy depends on. deploy.yml calls this workflow (workflow_call), so nothing
# reaches the server without passing these checks first.

on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # prisma.config.ts resolves DATABASE_URL at load time, so every prisma command needs it - even
  # `generate`, which never connects. In the quality job this is a throwaway value; in the
  # migrations job it points at the postgres service below.
  DATABASE_URL: postgresql://finarthax:finarthax@127.0.0.1:5432/finarthax

jobs:
  quality:
    name: Lint, types and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      # Required before lint/typecheck/build: the app imports "prisma-client", which is
      # file:generated/prisma - a gitignored folder this command creates.
      - run: npx prisma generate

      - run: npm run lint

      - run: npm run typecheck

      - name: Build
        env:
          NEXTAUTH_SECRET: build-time-placeholder
          NEXTAUTH_URL: http://localhost:3000
          NODE_ENV: production
        run: npm run build

  migrations:
    name: Migration safety
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finarthax
          POSTGRES_PASSWORD: finarthax
          POSTGRES_DB: finarthax
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finarthax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      # The seed imports src/lib, which imports "prisma-client" - without this it fails with
      # MODULE_NOT_FOUND.
      - run: npx prisma generate

      - name: Apply every migration to an empty database
        run: npx prisma migrate deploy

      - name: Seed
        env:
          NODE_ENV: production
        run: npx prisma db seed

      - name: Seed again
        # The deploy re-runs the seed on every release, so it has to be idempotent.
        env:
          NODE_ENV: production
        run: npx prisma db seed

      - name: Confirm the database matches schema.prisma
        # Catches a schema change that was never turned into a migration.
        run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  integration:
    name: Application and performance tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: finarthax
          POSTGRES_PASSWORD: finarthax
          POSTGRES_DB: finarthax
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finarthax"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Everything the app reads at boot. Google credentials are placeholders: the tests only check
      # that sign-in redirects to Google with the right callback, they never complete a login.
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: ci-only-secret-not-used-anywhere-else
      SESSION_EXPIRATION: "900"
      GOOGLE_CLIENT_ID: ci-placeholder.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: ci-placeholder
      BASE_CURRENCY: IDR
      BASE_CURRENCY_SYMBOL: Rp
      EXCHANGE_RATE_URL: https://api.exchangerate-api.com/v4/latest
      DATABASE_TIMEOUT_MS: "5000"
      HEALTH_CACHE_TTL_MS: "10000"
      APP_SETTINGS_CACHE_TTL_MS: "300000"
      RATES_CACHE_TTL_MS: "3600000"
      LOG_TO_CONSOLE: "false"
      BASE_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npx prisma generate

      - name: Migrate and seed
        # NODE_ENV is set per step, never for the job: production makes `npm ci` skip devDependencies
        # (tsx, prisma), and NODE_ENV=production is what selects the production seed.
        env:
          NODE_ENV: production
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      - run: npm run build

      - name: Start the app
        env:
          NODE_ENV: production
        run: |
          nohup npm start > app.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf "$BASE_URL/api/health" > /dev/null && exit 0
            sleep 2
          done
          echo "::error::app did not become healthy"; cat app.log; exit 1

      - name: Application tests
        run: npm test

      - name: Performance
        # Smaller than the local defaults so a shared runner stays quick; budgets are unchanged.
        env:
          PERF_USERS: "10"
          PERF_REQUESTS: "8"
          PERF_DATASET: "500"
        run: npm run test:perf

      - name: App log on failure
        if: failure()
        run: tail -n 200 app.log
