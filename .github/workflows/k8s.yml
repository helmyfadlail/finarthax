name: Kubernetes

# Keeps k8s/ honest: every change is rendered, schema-checked and ordering-checked before it can
# merge. Deploying is a separate, manual, opt-in job so a merge alone never touches a cluster.

on:
  pull_request:
    paths: ["k8s/**", ".github/workflows/k8s.yml"]
  push:
    branches: [main]
    paths: ["k8s/**", ".github/workflows/k8s.yml"]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Apply k8s/ to the cluster in the KUBE_CONFIG secret"
        type: boolean
        default: false

concurrency:
  group: k8s-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --no-audit --no-fund

      # secret.yaml holds real credentials and is gitignored, so CI validates against the template.
      - name: Use the placeholder secret
        run: cp k8s/secret.example.yaml k8s/secret.yaml

      - name: Render with Kustomize
        run: kubectl kustomize k8s/ > rendered.yaml

      # Namespace first, everything in the finarthax namespace, and every configMapKeyRef /
      # secretKeyRef pointing at a key that exists (scripts/validate-k8s.ts; its failure cases are
      # covered by the "Kubernetes manifests" tests in tests/app.test.ts).
      - name: Check ordering, namespaces and key references
        run: npm run k8s:validate

      - name: Validate against the Kubernetes schemas
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.34.0 rendered.yaml

      - name: Upload the rendered manifests
        uses: actions/upload-artifact@v4
        with:
          name: rendered-manifests
          path: rendered.yaml

  deploy:
    name: Deploy to cluster
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configure required reviewers on this environment to gate every deploy.
    environment: kubernetes

    steps:
      - uses: actions/checkout@v5

      - name: Configure kubectl
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$KUBE_CONFIG" || { echo "::error::the KUBE_CONFIG secret is not set"; exit 1; }
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # The real secret.yaml is stored as a base64 GitHub secret so it never lives in the repository:
      #   base64 -w0 k8s/secret.yaml | gh secret set K8S_SECRET_MANIFEST --env kubernetes
      - name: Write the real secret
        env:
          K8S_SECRET_MANIFEST: ${{ secrets.K8S_SECRET_MANIFEST }}
        run: |
          test -n "$K8S_SECRET_MANIFEST" || { echo "::error::the K8S_SECRET_MANIFEST secret is not set"; exit 1; }
          echo "$K8S_SECRET_MANIFEST" | base64 -d > k8s/secret.yaml

      - name: Dry run against the cluster
        run: kubectl apply -k k8s/ --dry-run=server

      - name: Apply
        run: kubectl apply -k k8s/

      - name: Wait for the rollout
        run: |
          kubectl rollout status deployment/postgres -n finarthax --timeout=180s
          kubectl rollout status deployment/finarthax -n finarthax --timeout=300s
