apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-pv
  labels:
    type: local
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: "/mnt/data/postgres"
  # For cloud providers, use appropriate storage class:
  # storageClassName: gp2  # AWS
  # storageClassName: standard  # GCP
  # storageClassName: default  # Azure
