apiVersion: apps/v1
kind: Deployment
metadata:
  name: finarthax
  namespace: finarthax
  labels:
    app: finarthax
    version: v1
spec:
  replicas: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: finarthax
  template:
    metadata:
      labels:
        app: finarthax
        version: v1
    spec:
      containers:
        - name: finarthax
          image: helmyyy/finarthax:latest
          # IfNotPresent so a local cluster (e.g. Docker Desktop) uses the image already
          # built with `docker compose build app` instead of pulling the published tag.
          # Switch back to Always for a real cluster pulling from the registry.
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            # Node Environment
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: NODE_ENV

            # PostgreSQL Configuration
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: finarthax-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finarthax-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: POSTGRES_DB
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: POSTGRES_HOST
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: POSTGRES_PORT

            # Database URL (constructed from above variables)
            - name: DATABASE_URL
              value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"

            # ImageKit Configuration
            - name: IMAGEKIT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: finarthax-secret
                  key: IMAGEKIT_PUBLIC_KEY
            - name: IMAGEKIT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: finarthax-secret
                  key: IMAGEKIT_PRIVATE_KEY
            - name: IMAGEKIT_URL_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: IMAGEKIT_URL_ENDPOINT
            - name: IMAGEKIT_UPLOAD_EXPIRE_SEC
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: IMAGEKIT_UPLOAD_EXPIRE_SEC

            # NextAuth Configuration
            - name: NEXTAUTH_URL
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: NEXTAUTH_URL
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: finarthax-secret
                  key: NEXTAUTH_SECRET

            # Google OAuth Configuration
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: finarthax-secret
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: finarthax-secret
                  key: GOOGLE_CLIENT_SECRET

            # Session
            - name: SESSION_EXPIRATION
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: SESSION_EXPIRATION

            # Superadmin — promoted by `db:seed` once this account is registered
            - name: SUPERADMIN_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: SUPERADMIN_EMAIL

            # Currency
            - name: BASE_CURRENCY
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: BASE_CURRENCY
            - name: BASE_CURRENCY_SYMBOL
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: BASE_CURRENCY_SYMBOL
            - name: EXCHANGE_RATE_URL
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: EXCHANGE_RATE_URL

            # Email — password resets and preference-gated notifications
            - name: RESEND_API_KEY
              valueFrom:
                secretKeyRef:
                  name: finarthax-secret
                  key: RESEND_API_KEY
            - name: RESEND_EMAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: RESEND_EMAIL_FROM

            # Scheduled notification digest — see k8s/digest-cronjob.yaml
            - name: CRON_SECRET
              valueFrom:
                secretKeyRef:
                  name: finarthax-secret
                  key: CRON_SECRET

            # Health probe budget. Without these the check used to fall back to a
            # 0 ms deadline and fail instantly, taking the pod down with it.
            - name: DATABASE_TIMEOUT_MS
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: DATABASE_TIMEOUT_MS
            - name: HEALTH_CACHE_TTL_MS
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: HEALTH_CACHE_TTL_MS
            - name: APP_SETTINGS_CACHE_TTL_MS
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: APP_SETTINGS_CACHE_TTL_MS
            - name: RATES_CACHE_TTL_MS
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: RATES_CACHE_TTL_MS

            # Logging — see the notes in k8s/configmap.yaml
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: LOG_LEVEL
            - name: LOG_FORMAT
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: LOG_FORMAT
            - name: LOG_TO_FILE
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: LOG_TO_FILE
            - name: LOG_TO_CONSOLE
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: LOG_TO_CONSOLE
            - name: LOG_DIR
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: LOG_DIR
            - name: LOG_FILE_MAX_SIZE_MB
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: LOG_FILE_MAX_SIZE_MB
            - name: LOG_FILE_RETENTION_DAYS
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: LOG_FILE_RETENTION_DAYS
            - name: LOG_SLOW_REQUEST_MS
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: LOG_SLOW_REQUEST_MS
            - name: LOG_SLOW_QUERY_MS
              valueFrom:
                configMapKeyRef:
                  name: finarthax-config
                  key: LOG_SLOW_QUERY_MS

            # Only used when the image runs against an encrypted .env
            - name: ENV_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: finarthax-secret
                  key: ENV_ENCRYPTION_KEY

          # The image ships /app/logs owned by uid 1001, but this pod runs as 1000.
          # Mounting an emptyDir here sidesteps that: fsGroup makes the volume
          # group-writable, so the app can always write its files.
          volumeMounts:
            - name: logs
              mountPath: /app/logs

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          # Liveness probe - checks if container is alive
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3

          # Readiness probe - checks if container is ready to serve traffic
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3

          # Startup probe - gives app time to start before liveness/readiness checks
          startupProbe:
            httpGet:
              path: /api/health
              port: 3000
              scheme: HTTP
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 30

      # Swap this for a persistentVolumeClaim if the log files must outlive the pod.
      volumes:
        - name: logs
          emptyDir: {}

      # Restart policy
      restartPolicy: Always

      # DNS policy
      dnsPolicy: ClusterFirst

      # Security context for the pod
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      # Termination grace period
      terminationGracePeriodSeconds: 30
