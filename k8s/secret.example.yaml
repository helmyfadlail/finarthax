# Template for secret.yaml. secret.yaml holds real credentials and is gitignored, so it never
# reaches GitHub. Set up a cluster with:
#
#   cp k8s/secret.example.yaml k8s/secret.yaml   # then fill in real values
#   kubectl apply -k k8s/
#
# CI copies this file to secret.yaml to validate the manifests; the placeholders are never deployed.
apiVersion: v1
kind: Secret
metadata:
  name: finarthax-secret
  namespace: finarthax
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "change-me"
  IMAGEKIT_PUBLIC_KEY: ""
  IMAGEKIT_PRIVATE_KEY: ""
  NEXTAUTH_SECRET: "generate-with-openssl-rand-base64-32"
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

  # Sends password resets and notification emails. Leave empty to disable email
  # entirely — every send then reports "not-configured" instead of failing.
  RESEND_API_KEY: ""

  # Bearer token the digest CronJobs present.
  CRON_SECRET: "generate-with-openssl-rand-base64-32"

  # Only needed when the image is run against an encrypted .env. Leave empty
  # otherwise — Kubernetes secrets already keep these values out of the image.
  ENV_ENCRYPTION_KEY: ""
