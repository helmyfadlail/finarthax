# docker compose --profile scheduler up -d

services:
  postgres:
    image: postgres:18-alpine
    container_name: finarthax-postgres
    environment:
      POSTGRES_USER: postgresdev
      POSTGRES_PASSWORD: DevFinArthax123
      POSTGRES_DB: finarthax_db_development
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    image: helmyyy/finarthax:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finarthax-app
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ENV_ENCRYPTION_KEY: 2yc7vYX8XBaJGiPOko6TfcVsdbCE2W4zg5HlKNMj5wA=
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgresdev
      DATABASE_URL: postgresql://postgresdev:DevFinArthax123@postgres:5432/finarthax_db_development
    ports:
      - "3000:3000"
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
    restart: unless-stopped

  digest:
    image: alpine:3.20
    container_name: finarthax-digest
    profiles: ["scheduler"]
    env_file:
      - .env
    depends_on:
      app:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        printf '%s\n' \
          '0 7 * * *   wget -q -O- --post-data "" --header="Authorization: Bearer $$CRON_SECRET" "http://app:3000/api/notifications/digest?kind=recurring" >> /var/log/digest.log 2>&1' \
          '0 8 * * 1   wget -q -O- --post-data "" --header="Authorization: Bearer $$CRON_SECRET" "http://app:3000/api/notifications/digest?kind=weekly"    >> /var/log/digest.log 2>&1' \
          > /etc/crontabs/root
        touch /var/log/digest.log
        crond -f -l 8 &
        tail -f /var/log/digest.log
    restart: unless-stopped

volumes:
  postgres_data:
